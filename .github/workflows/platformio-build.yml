name: PlatformIO Build

on:
  push:
    branches: [main, rebuild/watch-face-studio-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio jsonschema

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create temporary build-only Wi-Fi config
        run: |
          cat > src/secrets.h <<'EOF'
          #pragma once
          #define WIFI_SSID "BUILD_ONLY"
          #define WIFI_PASSWORD "BUILD_ONLY"
          EOF

      - name: Validate shared JSON schemas
        run: python scripts/validate_schemas.py

      - name: Validate Web app assets
        run: python scripts/validate_web.py

      - name: Check Web app JavaScript syntax
        run: node --check web/app.js

      - name: Build ESP32-C3 firmware
        run: pio run -e c3_clock

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-firmware
          path: .pio/build/c3_clock/firmware.bin
          if-no-files-found: error
          retention-days: 14
