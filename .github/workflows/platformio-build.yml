name: PlatformIO Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Create temporary build-only Wi-Fi config
        run: |
          cat > src/secrets.h <<'EOF'
          #pragma once
          #define WIFI_SSID "BUILD_ONLY"
          #define WIFI_PASSWORD "BUILD_ONLY"
          EOF

      - name: Build ESP32-C3 firmware
        run: pio run -e c3_clock
